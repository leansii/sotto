<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sotto — microphone access</title>
  <style>
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 480px; margin: 80px auto; color: #222; }
    button { font-size: 15px; padding: 8px 16px; border-radius: 6px; border: 1px solid #d8d5cd; background: #fff; cursor: pointer; }
    #status { margin-top: 12px; color: #666; }
  </style>
</head>
<body>
  <h2>Microphone access</h2>
  <p>To include your side of the conversation in HQ recordings, Sotto needs
  microphone access. This is a one-time permission for the extension; audio
  is processed locally only and never leaves your machine.</p>
  <button id="grant">Allow microphone</button>
  <div id="status"></div>
  <script src="mic.js"></script>
</body>
</html>
