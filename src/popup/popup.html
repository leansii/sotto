<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Sotto</h1>
    <span class="tagline">your words stay here</span>
  </header>
  <main id="sessions"></main>
  <footer>
    <label class="select-row">Meet caption language
      <select id="meet-lang">
        <option value="">— don't change —</option>
        <option value="Русский|Russian">Русский</option>
        <option value="English|Английский">English</option>
        <option value="Українська|Ukrainian">Українська</option>
        <option value="Deutsch|German">Deutsch</option>
        <option value="Français|French">Français</option>
        <option value="Español|Spanish">Español</option>
        <option value="Italiano|Italian">Italiano</option>
        <option value="Português|Portuguese">Português</option>
        <option value="Polski|Polish">Polski</option>
        <option value="Türkçe|Turkish">Türkçe</option>
      </select>
    </label>
    <label><input type="checkbox" id="autocc"> Auto-enable captions in Meet</label>
    <label><input type="checkbox" id="autosave"> Auto-save .txt when call ends</label>
  </footer>
  <template id="session-row">
    <div class="session">
      <div class="meta">
        <span class="title"></span>
        <span class="sub"></span>
      </div>
      <div class="actions">
        <button class="export-md" title="Export as Markdown">MD</button>
        <button class="export-txt" title="Export as plain text">TXT</button>
        <button class="delete" title="Delete transcript">✕</button>
      </div>
    </div>
  </template>
  <script src="../format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
